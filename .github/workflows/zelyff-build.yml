name: Zelyff build

on:
  push:
    branches: [zelyff-fork]
  pull_request:
    branches: [zelyff-fork]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile and test
        run: mvn -B -ntp -Dgpg.skip=true -Dmaven.javadoc.skip=true -DskipTests=false verify
      - name: Upload development plugin
        uses: actions/upload-artifact@v4
        with:
          name: RedProtect-Zelyff-development
          path: RedProtect-Spigot/target/RedProtect-*.jar
          if-no-files-found: error
          retention-days: 14
