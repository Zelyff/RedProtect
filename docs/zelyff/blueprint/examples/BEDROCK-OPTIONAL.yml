# ILLUSTRATIVE optional bedrock.yml; only create if it reduces coupling.
# Could instead be inserted as new subsection of existing user config.
# Not deployable as-is. Floodgate API support requires actual runtime checks.
config-version: 1
bedrock:
  forms:
    enabled: false # opt-in first rollout
    preferred-ui: NATIVE_FORMS
    fallback: LEGACY_COMMANDS
    paginated-claims: true
    page-size: 10
    session-timeout-seconds: 60
  rendering:
    fallback-border: BLOCK
    # White Java entity glowing cannot be guaranteed via Geyser/Bedrock.
    java-glow-unsupported-message: true
